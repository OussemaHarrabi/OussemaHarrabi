<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Oussema Harrabi — AI engineering and applied ML research</title>
  <desc id="desc">An animated network of research and engineering signals surrounding Oussema Harrabi's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.5" stop-color="#0B1930"/>
      <stop offset="1" stop-color="#061721"/>
    </linearGradient>
    <linearGradient id="accent" x1="260" y1="70" x2="940" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#7DD3FC" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .trace { stroke-dasharray: 10 18; animation: travel 8s linear infinite; }
      .trace.slow { animation-duration: 13s; animation-direction: reverse; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .pulse.delay { animation-delay: -1.4s; }
      .float { animation: float 5.8s ease-in-out infinite; }
      .float.delay { animation-delay: -2.2s; }
      @keyframes travel { to { stroke-dashoffset: -224; } }
      @keyframes pulse { 0%,100% { opacity:.45; transform:scale(.76); } 50% { opacity:1; transform:scale(1.18); } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="185" cy="86" r="155" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1035" cy="252" r="180" fill="#2DD4BF" fill-opacity="0.09" filter="url(#blur)"/>

  <path class="trace" d="M52 233C181 151 258 211 362 143C472 71 527 74 626 123" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="2"/>
  <path class="trace slow" d="M571 227C718 286 795 167 1142 93" stroke="#2DD4BF" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M101 87L253 56L345 109" stroke="#7DD3FC" stroke-opacity="0.18"/>
  <path d="M862 90L1011 138L1120 72" stroke="#5EEAD4" stroke-opacity="0.18"/>

  <g class="float">
    <circle cx="101" cy="87" r="5" fill="#38BDF8"/>
    <circle class="pulse" cx="101" cy="87" r="13" stroke="#38BDF8" stroke-opacity="0.5"/>
    <circle cx="253" cy="56" r="4" fill="#7DD3FC"/>
    <circle cx="345" cy="109" r="6" fill="#2DD4BF"/>
  </g>
  <g class="float delay">
    <circle cx="862" cy="90" r="5" fill="#F59E0B"/>
    <circle cx="1011" cy="138" r="4" fill="#2DD4BF"/>
    <circle cx="1120" cy="72" r="6" fill="#38BDF8"/>
    <circle class="pulse delay" cx="1120" cy="72" r="14" stroke="#38BDF8" stroke-opacity="0.45"/>
  </g>

  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="128" fill="#F8FAFC" font-size="52" font-weight="720" letter-spacing="1.5">OUSSEMA HARRABI</text>
    <rect x="378" y="151" width="444" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="600" y="194" fill="#BAE6FD" font-size="22" font-weight="550" letter-spacing="3.3">AI ENGINEERING · APPLIED ML RESEARCH</text>
    <text x="600" y="235" fill="#94A3B8" font-size="16" letter-spacing="1.2">reliable agents  ·  evidence-grounded systems  ·  efficient deep learning</text>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" fill="#7DD3FC" opacity="0.65">
    <text x="58" y="275">EVIDENCE</text>
    <text x="1064" y="275">SYSTEMS</text>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="279" fill="#FBBF24" font-size="12" font-weight="650" letter-spacing="2.2">HACKATHON HUNTER · 10+ PODIUM FINISHES</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="23.25" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="1.5"/>
</svg>
